<h1>文昌骑行一日</h1>
<p>早上从文昌市区出发，沿着海南岛东海岸骑到龙楼镇。第一站是铜鼓岭，爬到山顶可以看到月亮湾的整条弧线。</p>
<p>下山后去了石头公园，礁石很壮观，但午后很热。路边有人说宝陵港那边的渔船下午回港，可以去看看。</p>
<p>傍晚在一个没有名字的小海滩歇了半小时，位置大概在淇水湾和宝陵港之间。</p>
